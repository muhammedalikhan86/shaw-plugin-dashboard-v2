<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shaw Portal - Work Queue</title>
<link rel="stylesheet" href="assets/ds/roboto.css">
<style>
/* Content comes from queue.md, a copy of the Hub's .claude/queue.md, refreshed by the Hub session. This page only draws it.
   Opened from the folder (file://) the fetch is blocked, so it falls back to queue-data.js, which update-queue-data.ps1 regenerates. */
:root{--bg:#F4F4F4;--card:#FFFFFF;--ink:#1A1A1A;--muted:#5C5C5C;--line:#E0E0E0;--accent:#E8501E;--now:#FFF3EC;--moved:#FDEBE3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1E1E1E;--ink:#F2F2F2;--muted:#B0B0B0;--line:#333333;--accent:#FF6A33;--now:#2E1E16;--moved:#33221A}}
:root[data-theme="dark"]{--bg:#121212;--card:#1E1E1E;--ink:#F2F2F2;--muted:#B0B0B0;--line:#333333;--accent:#FF6A33;--now:#2E1E16;--moved:#33221A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/22px Roboto,"Helvetica Neue",Arial,sans-serif}
header{background:#000;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:16px}
header img{width:150px;height:auto;display:block}
main{max-width:1180px;margin:0 auto;padding:32px 16px 48px}
h1{font-weight:400;font-size:26px;line-height:34px;margin:0 0 8px}
h2{font-weight:500;font-size:19px;line-height:26px;margin:32px 0 10px}
p,li{color:var(--ink)}
code{font:500 13px/20px "Roboto Mono",Consolas,monospace;overflow-wrap:anywhere}
a{color:var(--accent)}
.scroll{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px;line-height:20px}
th{text-align:left;font-weight:500;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.now td{background:var(--now)}
tr.now td:nth-child(2){color:var(--accent);font-weight:500}
#err{color:var(--accent)}
a.jump{text-decoration:underline;text-underline-offset:2px}
@keyframes flash{from{box-shadow:inset 4px 0 0 var(--accent);background:var(--now)}to{box-shadow:inset 4px 0 0 transparent}}
tr.flash td{animation:flash 2.4s ease-out}
tr.flash td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
/* Reorder proposal: drag a row by its handle (or Alt+Up / Alt+Down on a focused row); Submit copies the proposal and resets. Nothing is saved. */
#submit{font:500 14px/20px Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff;background:var(--accent);border:0;border-radius:20px;padding:8px 20px;cursor:pointer}
#submit:hover{filter:brightness(1.08)}
#submit:focus-visible{outline:2px solid #fff;outline-offset:2px}
th.grip,td.grip{width:28px;padding-left:10px;padding-right:0}
td.grip{color:var(--muted);cursor:grab;user-select:none;letter-spacing:-1px;font-weight:700;white-space:nowrap}
tr.dragging td{opacity:.45}
tr.drop-above td{box-shadow:inset 0 2px 0 var(--accent)}
tr.drop-below td{box-shadow:inset 0 -2px 0 var(--accent)}
tr.moved td{background:var(--moved)}
tr.moved td.grip{box-shadow:inset 3px 0 0 var(--accent);color:var(--accent)}
tbody tr[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
/* Worker map: one lane per worker, one pill per group in queue order, an orange cursor where the worker is. Drawn from queue.md. */
:root{--done:#2a78d6;--done-soft:#E3EEFB;--wait:#898781}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--done:#3987e5;--done-soft:#18324F;--wait:#8E8C86}}
:root[data-theme="dark"]{--done:#3987e5;--done-soft:#18324F;--wait:#8E8C86}
.map{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 0 8px;margin:0 0 8px}
.map .legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);padding:0 20px 12px;border-bottom:1px solid var(--line)}
.map .legend span{display:inline-flex;align-items:center;gap:6px}
.map .sw{width:22px;height:12px;border-radius:999px;display:inline-block;border:1.5px solid var(--ink)}
.lane{display:grid;grid-template-columns:190px minmax(0,1fr);border-bottom:1px solid var(--line)}
.lane:last-child{border-bottom:0}
.lane .who{padding:14px 12px 14px 20px;font-weight:500;font-size:14px;line-height:20px;border-right:1px solid var(--line)}
.lane .who small{display:block;font-weight:400;color:var(--muted);font-size:12px;line-height:16px;margin-top:2px}
.track{position:relative;display:flex;align-items:center;gap:0;padding:26px 16px 12px;overflow-x:auto}
.track::before{content:"";position:absolute;left:16px;right:16px;top:calc(50% + 7px);height:2px;background:var(--line)}
.pill{position:relative;flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;margin-right:14px;border-radius:999px;
  border:1.5px solid var(--ink);background:var(--card);color:var(--ink);font:500 13px/18px Roboto,"Helvetica Neue",Arial,sans-serif;cursor:default;white-space:nowrap}
.pill em{font-style:normal;font-weight:400;color:var(--muted)}
.pill.done{border-color:var(--done);background:var(--done-soft);color:var(--done)}
.pill.done em{color:var(--done)}
.pill.now{border-color:var(--accent);background:var(--accent);color:#fff}
.pill.now em{color:#fff;opacity:.85}
.pill.wait{border-style:dashed;border-color:var(--wait);color:var(--muted)}
.pill.sync{border-color:#7B5CD6;color:#7B5CD6;border-style:dotted;border-width:2px}
.pill.sync em{color:#7B5CD6}
.pill.event{border-color:#7B5CD6;background:#7B5CD6;color:#fff}
.pill.event em{color:#fff;opacity:.85}
.lane.hub .who{color:#7B5CD6}
.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cursor{position:relative;flex:none;width:2px;height:40px;background:var(--accent);margin:0 14px 0 0;align-self:center;top:3px}
.cursor b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:2px;font:500 11px/14px Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--accent);white-space:nowrap}
.cursor::after{content:"";position:absolute;top:-1px;left:-4px;border:5px solid transparent;border-top-color:var(--accent)}
.pill.now+.cursor,.cursor+.pill.now{margin-left:0}
#qtip{position:fixed;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.18);border-radius:8px;
  padding:8px 10px;font-size:13px;line-height:18px;max-width:360px;z-index:10;display:none}
#qtip b{font-weight:500}
#qtip ul{margin:4px 0 0;padding-left:16px}
#qtip li{margin:0 0 4px}
#qtip .st{color:var(--muted)}
@media (max-width:640px){.lane{grid-template-columns:minmax(0,1fr)}.lane .who{border-right:0;padding-bottom:0}}
</style>
</head>
<body>
<header><a href="index.html"><img src="assets/logo-primary-reversed-3x.png" alt="Shaw and Partners"></a><button id="submit" type="button" title="Copy the proposed order to the clipboard and reset the page">Submit</button></header>
<main>
<div id="out"><p>Loading the queue…</p></div>
<p id="err" hidden></p>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="queue-data.js"></script>
<script>
const out=document.getElementById('out');
let MD=null;
const col=(t,name)=>[...t.querySelectorAll('thead th')].findIndex(th=>th.textContent.trim()===name);
// Worker map: read each worker section (an h2 followed by a table with Grp, ID and Item columns), group its rows by Grp in table order,
// and draw one pill per group. ">>" rows make their group the current one; the "Done <date>:" line under a table becomes a done pill.
function cellText(c){return c?c.textContent.trim():''}
function buildMap(){
  const lanes=[];
  out.querySelectorAll('h2').forEach(h=>{
    let t=h.nextElementSibling;while(t&&t.tagName!=='TABLE'&&t.tagName!=='H2')t=t.nextElementSibling;
    if(!t||t.tagName!=='TABLE')return;
    const iG=col(t,'Grp'),iId=col(t,'ID'),iItem=col(t,'Item'),iSize=col(t,'Size'),iSt=col(t,'Status');
    if(iG<0||iId<0||iItem<0)return;
    const m=h.textContent.match(/^(.*?)\s*\((?:pointer:\s*)?(.*)\)\s*$/),name=m?m[1]:h.textContent.trim(),pointer=m?m[2]:'';
    const groups=[],byKey=new Map();
    [...t.tBodies[0].rows].forEach(tr=>{
      let g=cellText(tr.cells[iG])||'X';
      if(!byKey.has(g)){const o={key:g,rows:[],now:false};byKey.set(g,o);groups.push(o)}
      const o=byKey.get(g);
      if(cellText(tr.cells[0])==='>>')o.now=true;
      o.rows.push({id:cellText(tr.cells[iId]),item:cellText(tr.cells[iItem]),size:iSize<0?'':cellText(tr.cells[iSize]),st:iSt<0?'':cellText(tr.cells[iSt])});
    });
    // Waiting rows that wait on the designer become their own "After the design sync" group, just before the other waiting rows.
    const x=byKey.get('X');
    if(x){const ds=x.rows.filter(r=>/designer/i.test(r.st));
      if(ds.length){x.rows=x.rows.filter(r=>!ds.includes(r));const o={key:'SYNC',rows:ds,now:false};groups.push(o);if(!x.rows.length)groups.splice(groups.indexOf(x),1)}}
    // Waiting (X) groups always sit at the end of the lane.
    const rank=g=>g.key==='X'?2:g.key==='SYNC'?1:0;groups.sort((a,b)=>rank(a)-rank(b));
    let done=null,p=t.nextElementSibling;
    while(p&&p.tagName!=='H2'){const dm=p.tagName==='P'&&p.textContent.match(/^Done ([\d-]+):\s*(.*)$/);if(dm){done={date:dm[1],ids:dm[2].replace(/\.$/,'')};break}p=p.nextElementSibling}
    lanes.push({name,pointer,groups,done});
  });
  if(!lanes.length)return;
  SYNC=null;out.querySelectorAll('p').forEach(p=>{const m=p.textContent.match(/^Design sync at (\d\d:\d\d)\s*([^:]*):\s*(.*)$/);if(m&&!SYNC)SYNC={time:m[1],when:m[2],text:m[3]}});
  const map=document.createElement('div');map.className='map';map.setAttribute('aria-label','Worker map');
  map.innerHTML='<div class="legend"><span><i class="sw" style="background:var(--done-soft);border-color:var(--done)"></i>Done</span>'+
    '<span><i class="sw" style="background:var(--accent);border-color:var(--accent)"></i>Being worked on</span>'+
    '<span><i class="sw"></i>Next, in order</span><span><i class="sw" style="border-style:dashed;border-color:var(--wait)"></i>Waiting (blocked or held)</span>'+
    '<span><i class="sw" style="border-style:dotted;border-width:2px;border-color:#7B5CD6"></i>Unblocked by the design sync</span>'+
    '<span><i class="sw" style="width:2px;border:0;border-radius:0;background:var(--accent)"></i>Where the worker is</span></div>';
  if(SYNC){
    const lane=document.createElement('div');lane.className='lane hub';
    const who=document.createElement('div');who.className='who';who.textContent='Hub';const sm=document.createElement('small');sm.textContent='Design sync, unattended';who.appendChild(sm);
    const track=document.createElement('div');track.className='track';
    const ev=pill('Design sync '+SYNC.time,SYNC.when,'event');ev._tip={title:'Design sync at '+SYNC.time+' '+SYNC.when,rows:[{id:SYNC.text}]};SYNC.el=ev;
    track.appendChild(ev);lane.append(who,track);map.appendChild(lane)}
  lanes.forEach(L=>{
    const lane=document.createElement('div');lane.className='lane';
    const who=document.createElement('div');who.className='who';who.textContent=L.name;
    if(L.pointer){const s=document.createElement('small');s.textContent=L.pointer;who.appendChild(s)}
    const track=document.createElement('div');track.className='track';
    const cursor=label=>{const c=document.createElement('span');c.className='cursor';const b=document.createElement('b');b.textContent=label;c.appendChild(b);return c};
    if(L.done){const d=pill('Done',items(L.done.ids.split(/,\s*/).length),'done');d._tip={title:'Done '+L.done.date,rows:L.done.ids.split(/,\s*/).map(id=>({id}))};track.appendChild(d)}
    const nowAt=L.groups.findIndex(g=>g.now),firstNext=L.groups.findIndex(g=>g.key!=='X'&&g.key!=='SYNC');
    let placed=false;
    L.groups.forEach((g,i)=>{
      const wait=g.key==='X',pts=sumPts(g.rows);
      if(!placed&&((nowAt>=0&&i===nowAt)||(nowAt<0&&(i===firstNext||(firstNext<0&&i===0))))){track.appendChild(cursor(nowAt>=0?'now':'parked'));placed=true}
      if(g.key==='SYNC'){const el=pill('After sync'+(SYNC?' '+SYNC.time:''),items(g.rows.length),'sync');
        el._tip={title:'Unblocked by the design sync'+(SYNC?' at '+SYNC.time:'')+' · '+items(g.rows.length),rows:g.rows};track.appendChild(el);return}
      const el=pill(wait?'Waiting':'Grp '+g.key,wait?items(g.rows.length):pts,wait?'wait':(g.now?'now':''));
      el._tip={title:(wait?'Waiting':'Group '+g.key)+' · '+g.rows.length+(g.rows.length===1?' item':' items')+(wait?'':' · '+pts),rows:g.rows};
      track.appendChild(el);
    });
    if(!placed)track.appendChild(cursor('parked'));
    lane.append(who,track);map.appendChild(lane);
  });
  // The sync's tooltip lists, per worker, the rows it unblocks.
  if(SYNC){const rows=[];lanes.forEach(L=>L.groups.forEach(g=>{if(g.key==='SYNC')rows.push({id:L.name,item:g.rows.map(r=>r.id==='-'?r.item:r.id).join('; ')})}));
    SYNC.el._tip={title:'Design sync at '+SYNC.time+' '+SYNC.when+': unblocks',rows:rows.concat([{id:'Rows still open, or only questions back, go to the next designer round.'}])};
    SYNC.el.querySelector('em').textContent=SYNC.when+' · unblocks '+rows.length+' workers'}
  const first=out.querySelector('h2');out.insertBefore(map,first);
}
function items(n){return n+(n===1?' item':' items')}
function sumPts(rows){let n=0,unk=false;rows.forEach(r=>{const v=parseFloat(r.size);if(isNaN(v))unk=true;else n+=v});return unk?(n?n+'+?? pts':'?? pts'):n+(n===1?' pt':' pts')}
function pill(label,sub,cls){const b=document.createElement('span');b.className='pill'+(cls?' '+cls:'');b.tabIndex=0;b.textContent=label+' ';const e=document.createElement('em');e.textContent=sub;b.appendChild(e);return b}
let SYNC=null;
const qtip=document.createElement('div');qtip.id='qtip';qtip.setAttribute('role','tooltip');document.body.appendChild(qtip);
function showTip(el,x,y){const T=el._tip;if(!T)return;qtip.innerHTML='';const b=document.createElement('b');b.textContent=T.title;qtip.appendChild(b);
  const ul=document.createElement('ul');T.rows.forEach(r=>{const li=document.createElement('li');li.textContent=(r.id==='-'?'':r.id+(r.item?' — ':''))+(r.item||'')+(r.size&&r.size!=='-'?' ('+r.size+')':'');
    if(r.st){const s=document.createElement('div');s.className='st';s.textContent=r.st;li.appendChild(s)}ul.appendChild(li)});qtip.appendChild(ul);
  qtip.style.display='block';const w=qtip.offsetWidth,h=qtip.offsetHeight;
  qtip.style.left=Math.max(8,Math.min(x+12,innerWidth-w-8))+'px';qtip.style.top=(y+h+20>innerHeight?Math.max(8,y-h-12):y+16)+'px'}
out.addEventListener('mousemove',e=>{const p=e.target.closest('.pill');if(p)showTip(p,e.clientX,e.clientY);else qtip.style.display='none'});
out.addEventListener('mouseleave',()=>qtip.style.display='none');
out.addEventListener('focusin',e=>{const p=e.target.closest('.pill');if(p){const r=p.getBoundingClientRect();showTip(p,r.left,r.bottom)}});
out.addEventListener('focusout',()=>qtip.style.display='none');
// A section is an h2 and everything up to the next h2. "Now" is never shown, even if queue.md has one; "Hub" always comes first.
function sectionOf(h){const els=[h];let n=h.nextElementSibling;while(n&&n.tagName!=='H2'){els.push(n);n=n.nextElementSibling}return els}
function shapeSections(){
  out.querySelectorAll('h2').forEach(h=>{if(/^now\b/i.test(h.textContent.trim()))sectionOf(h).forEach(e=>e.remove())});
  const hub=[...out.querySelectorAll('h2')].find(h=>/^hub\b/i.test(h.textContent.trim())),first=out.querySelector('h2');
  if(hub&&hub!==first)sectionOf(hub).forEach(e=>out.insertBefore(e,first));
}
function render(md){
  out.innerHTML=marked.parse(md);
  shapeSections();
  buildMap();
  out.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='scroll';t.parentNode.insertBefore(w,t);w.appendChild(t);
    t.querySelectorAll('tbody tr').forEach(tr=>{if(tr.cells[0]&&tr.cells[0].textContent.trim()==='>>')tr.classList.add('now')})});
  // Each worker row gets an anchor from its ID; an ID in "Depends on" or "Status" that names a row here becomes an in-page link to it.
  const rows=new Map();
  out.querySelectorAll('table').forEach(t=>{const i=col(t,'ID');if(i<0)return;
    t.querySelectorAll('tbody tr').forEach(tr=>{const id=tr.cells[i]&&tr.cells[i].textContent.trim();if(/^[A-Z]+(-[A-Z]+)*-[FBS]-\d+$/.test(id)){tr.id='q-'+id;rows.set(id,tr)}})});
  const re=/\b[A-Z]+(?:-[A-Z]+)*-[FBS]-\d+\b/g;
  out.querySelectorAll('table').forEach(t=>['Depends on','Status'].forEach(n=>{const i=col(t,n);if(i<0)return;
    t.querySelectorAll('tbody tr').forEach(tr=>{const c=tr.cells[i];if(!c)return;
      c.innerHTML=c.innerHTML.replace(re,m=>rows.has(m)&&rows.get(m)!==tr?'<a href="#q-'+m+'" class="jump">'+m+'</a>':m)})}));
  // Worker tables (those with ID and Item columns) get a drag handle per row and remember each row's original place.
  out.querySelectorAll('table').forEach(t=>{const iId=col(t,'ID');if(iId<0||col(t,'Item')<0)return;
    const h=document.createElement('th');h.className='grip';h.setAttribute('aria-label','Reorder');t.querySelector('thead tr').prepend(h);
    const body=t.tBodies[0];if(!body)return;
    [...body.rows].forEach((tr,i)=>{tr.dataset.orig=i;tr.tabIndex=0;
      tr.setAttribute('aria-label',((tr.cells[iId]||{}).textContent||'Row')+'. Alt+Up or Alt+Down to move');
      const g=document.createElement('td');g.className='grip';g.textContent='⋮⋮';g.title='Drag to reorder (or Alt+Up / Alt+Down)';tr.prepend(g)})});
}
const sameBody=(a,b)=>a&&b&&a!==b&&a.parentElement===b.parentElement;
function markMoved(body){[...body.rows].forEach((tr,i)=>tr.classList.toggle('moved',String(i)!==tr.dataset.orig))}
let dragRow=null;
const clearDrop=()=>out.querySelectorAll('.drop-above,.drop-below').forEach(r=>r.classList.remove('drop-above','drop-below'));
const above=(e,tr)=>{const r=tr.getBoundingClientRect();return e.clientY<r.top+r.height/2};
out.addEventListener('mousedown',e=>{const g=e.target.closest('td.grip');if(g)g.parentElement.draggable=true});
out.addEventListener('mouseup',e=>{const tr=e.target.closest('tr');if(tr&&!dragRow)tr.draggable=false});
out.addEventListener('dragstart',e=>{const tr=e.target.closest&&e.target.closest('tr');if(!tr||!tr.draggable){e.preventDefault();return}
  dragRow=tr;tr.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',tr.id||'row')}catch(_){}});
out.addEventListener('dragover',e=>{const tr=e.target.closest('tr');if(!sameBody(tr,dragRow))return;
  e.preventDefault();e.dataTransfer.dropEffect='move';clearDrop();tr.classList.add(above(e,tr)?'drop-above':'drop-below')});
out.addEventListener('drop',e=>{const tr=e.target.closest('tr');if(!sameBody(tr,dragRow))return;e.preventDefault();
  tr.parentElement.insertBefore(dragRow,above(e,tr)?tr:tr.nextSibling);markMoved(tr.parentElement)});
out.addEventListener('dragend',()=>{if(dragRow){dragRow.classList.remove('dragging');dragRow.draggable=false}dragRow=null;clearDrop()});
out.addEventListener('keydown',e=>{if(!e.altKey||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;
  const tr=e.target;if(tr.tagName!=='TR'||tr.dataset.orig===undefined)return;e.preventDefault();
  const sib=e.key==='ArrowUp'?tr.previousElementSibling:tr.nextElementSibling;if(!sib)return;
  tr.parentElement.insertBefore(tr,e.key==='ArrowUp'?sib:sib.nextSibling);markMoved(tr.parentElement);tr.focus()});
out.addEventListener('click',e=>{const a=e.target.closest('a.jump');if(!a)return;e.preventDefault();
  const tr=document.getElementById(a.getAttribute('href').slice(1));if(!tr)return;
  history.replaceState(null,'',a.getAttribute('href'));
  tr.scrollIntoView({behavior:'smooth',block:'center'});
  tr.classList.remove('flash');void tr.offsetWidth;tr.classList.add('flash')});
// Submit: copy a plain-text proposal of only the tables whose order changed, then put the page back to the current queue.
let toastTimer;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200)}
function legacyCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();if(!ok)throw new Error('copy failed')}
function copyText(text){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(text).catch(()=>legacyCopy(text));
  try{legacyCopy(text);return Promise.resolve()}catch(err){return Promise.reject(err)}
}
function buildProposal(){
  const parts=[];
  out.querySelectorAll('table').forEach(t=>{const body=t.tBodies[0];if(!body||!body.querySelector('td.grip'))return;
    const rows=[...body.rows];if(rows.every((tr,i)=>String(i)===tr.dataset.orig))return;
    let h=t.closest('.scroll').previousElementSibling;while(h&&h.tagName!=='H2')h=h.previousElementSibling;
    const worker=h?h.textContent.replace(/\s*\(.*$/,'').trim():'(unnamed table)';
    const iId=col(t,'ID'),iItem=col(t,'Item');
    parts.push('Proposed order for '+worker+': '+rows.map((tr,i)=>(i+1)+'. '+tr.cells[iId].textContent.trim()+' '+tr.cells[iItem].textContent.trim()).join(', '));
  });
  return parts.join('\n');
}
document.getElementById('submit').addEventListener('click',()=>{
  if(MD===null)return;
  const text=buildProposal();
  if(!text){toast('Nothing changed');return}
  window.__lastProposal=text;
  copyText(text).then(()=>toast('Proposal copied — paste it to the hub'),()=>toast('Could not copy the proposal')).finally(()=>render(MD));
});
function start(md){MD=md;render(md);
  if(location.hash){const tr=document.getElementById(location.hash.slice(1));if(tr){tr.scrollIntoView({block:'center'});tr.classList.add('flash')}}}
// Over http (Vercel) the page fetches queue.md; from the folder (file://) the fetch is blocked, so it uses window.QUEUE_MD from queue-data.js.
fetch('queue.md',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(start).catch(e=>{
  if(typeof window.QUEUE_MD==='string'){start(window.QUEUE_MD);return}
  const el=document.getElementById('err');el.hidden=false;el.textContent='The queue could not be loaded ('+e.message+').'});
</script>
</body>
